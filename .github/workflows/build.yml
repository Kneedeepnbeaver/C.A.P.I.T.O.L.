name: Build/Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r electron-app/requirements.txt
        shell: bash

      - name: Build Python Backend
        run: |
          cd electron-app
          python build_python.py
        shell: bash
        env:
          # Critical: Add project root to PYTHONPATH so `import rag` works in build_python.py
          PYTHONPATH: ${{ github.workspace }}

      - name: Install Node Dependencies
        run: |
          cd electron-app
          npm ci

      - name: Build React App
        run: |
          cd electron-app
          npm run build

      - name: Build Electron App
        uses: samuelmeuli/action-electron-builder@v1.6.0
        with:
          package_root: electron-app
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
          # Force ad-hoc signing on Mac (identity=null works if auto-discovery is off, or use "-")
          # For GitHub Actions, we typically want standard signing if we had secrets, but for now:
          args: "--config.mac.identity=null"

      - name: Upload Artifacts (Always upload for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: electron-app/release/*
